name: supervisor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supervisor.yml"
      - "internal/agentbridge/supervisor/**"
      - "internal/agentbridge/controlplane/**"
      - "internal/agentbridge/runtimeactor/**"
      - "internal/agentbridge/bridge/**"
      - "internal/agentbridge/session/**"
      - "internal/agentbridge/toolargs/**"
      - "internal/ir/ingest/**"
      - "internal/policy/**"
      - "internal/process/**"
      - "internal/scheduling/**"
      - "internal/providerrecovery/**"
      - "internal/workdir/**"
      - "docs/20-domain/provider-runtime.md"
      - "docs/20-domain/runtime-scheduling.md"
      - "docs/migration/daemon.md"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - ".github/workflows/supervisor.yml"
      - "internal/agentbridge/supervisor/**"
      - "internal/agentbridge/controlplane/**"
      - "internal/agentbridge/runtimeactor/**"
      - "internal/agentbridge/bridge/**"
      - "internal/agentbridge/session/**"
      - "internal/agentbridge/toolargs/**"
      - "internal/ir/ingest/**"
      - "internal/policy/**"
      - "internal/process/**"
      - "internal/scheduling/**"
      - "internal/providerrecovery/**"
      - "internal/workdir/**"
      - "docs/20-domain/provider-runtime.md"
      - "docs/20-domain/runtime-scheduling.md"
      - "docs/migration/daemon.md"
      - "go.mod"
      - "go.sum"

jobs:
  supervisor-run-controller-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify no non-Riido Go dependencies
        run: |
          allowed="github.com/teamswyg/riido-contracts"
          disallowed="$(go list -m all | awk -v allowed="$allowed" 'NR > 1 && $1 != allowed { print $1 }')"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed Go dependencies:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Verify supervisor dependency boundary
        run: |
          imports="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/agentbridge/supervisor)"
          forbidden_pattern='github.com/teamswyg/riido_daemon(/|$)|github.com/teamswyg/riido-daemon/internal/(provider|task|project|riidoapi|riidoaiserver|mwsdbridge|agentbridge/controlplane/(saasplane|taskdbplane))(/|$)'
          for denied in \
            github.com/teamswyg/riido_daemon/internal/legacy \
            github.com/teamswyg/riido-daemon/internal/provider \
            github.com/teamswyg/riido-daemon/internal/provider/claude \
            github.com/teamswyg/riido-daemon/internal/task \
            github.com/teamswyg/riido-daemon/internal/project \
            github.com/teamswyg/riido-daemon/internal/riidoapi \
            github.com/teamswyg/riido-daemon/internal/riidoaiserver \
            github.com/teamswyg/riido-daemon/internal/mwsdbridge \
            github.com/teamswyg/riido-daemon/internal/agentbridge/controlplane/saasplane \
            github.com/teamswyg/riido-daemon/internal/agentbridge/controlplane/taskdbplane; do
            if ! printf '%s\n' "$denied" | grep -Eq "$forbidden_pattern"; then
              printf 'Dependency boundary failed to reject %s\n' "$denied"
              exit 1
            fi
          done
          for allowed in \
            github.com/teamswyg/riido-daemon/internal/providerrecovery \
            github.com/teamswyg/riido-daemon/internal/agentbridge/runtimeactor; do
            if printf '%s\n' "$allowed" | grep -Eq "$forbidden_pattern"; then
              printf 'Dependency boundary rejected allowed package %s\n' "$allowed"
              exit 1
            fi
          done
          forbidden="$(printf '%s\n' "$imports" | grep -E "$forbidden_pattern" || true)"
          if [ -n "$forbidden" ]; then
            printf 'Forbidden supervisor imports:\n%s\n' "$forbidden"
            exit 1
          fi
      - name: Verify supervisor black-box/domain gates
        run: |
          go test ./internal/agentbridge/supervisor -count=1
      - name: Write package workflow evidence
        if: always()
        run: |
          mkdir -p out
          go run ./tools/packageworkflowevidence \
            -workflow .github/workflows/supervisor.yml \
            -evidence-out out/supervisor-evidence.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: supervisor-evidence
          path: out/supervisor-evidence.json
          if-no-files-found: error
